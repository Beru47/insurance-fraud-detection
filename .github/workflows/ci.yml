name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest -q
      - name: Training smoke run (small sample)
        run: |
          python -m fraudlab.cli data --n 6000 --out /tmp/claims.csv
          python -m fraudlab.cli train --data /tmp/claims.csv --model /tmp/bundle.joblib --reports /tmp/reports --n-estimators 40 --mc-sims 20
